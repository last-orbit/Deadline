<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav></nav>
    <main>
      <!-- Deadline Section -->
      <section>
        <h1>What is your deadline?</h1>
        <form>
          <fieldset>
            <div>
              <label for="name">Deadline Name:</label>
              <input type="text" id="" placeholder="Finish project by today" />
            </div>
            <div>
              <label for="name">Deadline:</label>
              <input type="date" id="" placeholder="October 26th 1985" />
            </div>
            <button>Submit</button>
          </fieldset>
        </form>
      </section>
      <!-- To Do Section -->
      <section>
        <div class="todo-title">
          <h1>To Do</h1>
          <button onclick="openBox()">Add Task <span>+</span></button>
        </div>
        <!-- Create Task -->
        <form id="taskForm">
          <fieldset>
            <h2>Create your task</h2>
            <!-- Main div -->
            <div>
              <div>
                <label for="taskName">Task name:</label>
                <input type="text" placeholder="task name" id="taskName" />
              </div>
              <div>
                <label for="status">Status:</label>
                <select id="status">
                    <option value="Not Started" selected="selected">Not Started</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Waiting">Waiting</option>
                </select>
              </div>
              <div>
                <label for="priority">Priority:</label>
                <select id="priority">
                  <option value="1" selected="selected">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </div>
            </div>
            <button type="submit">Submit</button>
          </fieldset>
        </form>
        <div>
          <div id="taskList"></div>
          <div id="completeTaskList"></div>
        </div>
        <!-- <div>
      <input type="checkbox" id="checkbox" name="complete" />
      <label for="checkbox" onclick="completeTask()">Complete</label>
    </div>
    <div>
      <button>Delete <span>🗑️</span></button>
    </div> -->
      </section>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
