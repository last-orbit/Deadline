<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadline</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav></nav>
    <main>
      <!-- Deadline Section -->
      <section>
        <h1>What is your deadline?</h1>
        <button onclick="deadlineBox()">Create Deadline <span>+</span></button>
        <div>
            <label for="deadlineDropdown">choose your deadline</label>
            <select id="deadlineDropdown">
            </select>
        </div>
        <!-- Create Date -->
        <form id="dateForm">
          <fieldset>
            <div>
              <label for="deadlineName">Deadline Name:</label>
              <input type="text" id="deadlineName" placeholder="Finish project by today" />
            </div>
            <div>
              <label for="deadline">Deadline:</label>
              <input type="date" id="deadline" placeholder="October 26th 1985" />
            </div>
            <button id="dateSubmit" type="submit">Submit</button>
            <button type="button" id="dateClose">Close</button>
          </fieldset>
        </form>
        <div id="dateInfo">
        </div>
        <div id="timebox">
          <div class="time">
            <h2 id="days">00</h2>
            <p>Days</p>
          </div>
          <div class="time">
            <h2 id="hours">00</h2>
            <p>Hours</p>
          </div>
          <div class="time">
            <h2 id="minutes">00</h2>
            <p>Minutes</p>
          </div>
          <div class="time">
            <h2 id="seconds">00</h2>
            <p>Seconds</p>
          </div>
        </div>
      </section>
      <!-- To Do Section -->
      <section>
        <div class="todo-title">
          <h1>To Do</h1>
          <button onclick="taskBox()">Add Task <span>+</span></button>
        </div>
        <!-- Create Task -->
        <form id="taskForm">
          <fieldset>
            <h2>Create your task</h2>
            <!-- Main div -->
            <div>
              <div>
                <label for="taskName">Task name:</label>
                <input type="text" placeholder="task name" id="taskName"/>
              </div>
              <div>
                <label for="status">Status:</label>
                <select id="status">
                  <option value="Not Started" selected="selected">
                    Not Started
                  </option>
                  <option value="In Progress">In Progress</option>
                  <option value="Waiting">Waiting</option>
                </select>
              </div>
              <div>
                <label for="priority">Priority:</label>
                <select id="priority">
                  <option value="1" selected="selected">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                </select>
              </div>
            </div>
            <button type="submit">Submit</button>
            <button type="button" id="taskClose">Close</button>
          </fieldset>
        </form>
        <div>
          <div id="taskList"></div>
          <div id="completeTaskList"></div>
        </div>
        <!-- <div>
      <input type="checkbox" id="checkbox" name="complete" />
      <label for="checkbox" onclick="completeTask()">Complete</label>
    </div>
    <div>
      <button>Delete <span>🗑️</span></button>
    </div> -->
      </section>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
