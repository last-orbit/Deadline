<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadline</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- Deadline Section -->
      <!-- Nav -->
      <nav>
        <h1>What's your deadline?</h1>
        <div>
          <button onclick="deadlineBox()">
            Create Deadline <span>+</span>
          </button>
          <label for="deadlineDropdown">Choose your deadline</label>
          <select id="deadlineDropdown"></select>
        </div>
      </nav>
      <section>
        <!-- Create Date -->
        <form id="dateForm">
          <fieldset>
            <div>
              <label for="deadlineName">Deadline Name:</label>
              <input
                type="text"
                id="deadlineName"
                placeholder="Finish project by today"
                required
              />
            </div>
            <div>
              <label for="deadline">Deadline:</label>
              <input
                type="date"
                id="deadline"
                required
              />
            </div>
            <div>
              <label for="time">Time:</label>
              <input type="time" id="time" value="08:00" required />
            </div>
            <button id="dateSubmit" type="submit">Submit</button>
            <button type="button" id="dateClose">Close</button>
          </fieldset>
        </form>
        <!-- Countdown -->
        <div id="dateInfo"></div>
        <div id="timebox">
          <div class="time">
            <h2 id="days">00</h2>
            <p>Days</p>
          </div>
          <div class="time">
            <h2 id="hours">00</h2>
            <p>Hours</p>
          </div>
          <div class="time">
            <h2 id="minutes">00</h2>
            <p>Minutes</p>
          </div>
          <div class="time">
            <h2 id="seconds">00</h2>
            <p>Seconds</p>
          </div>
        </div>
      </section>
      <!-- To Do Section -->
      <section>
        <div class="todo-title">
          <h1>To Do</h1>
          <button onclick="taskBox()">Add Task <span>+</span></button>
        </div>
        <!-- Create Task -->
        <form id="taskForm">
          <fieldset>
            <h2>Create your task</h2>
            <div>
              <div>
                <label for="taskName">Task name:</label>
                <input type="text" placeholder="task name" id="taskName" />
              </div>
              <div>
                <label for="status">Status:</label>
                <select id="status">
                  <option value="Not Started" selected="selected">
                    Not Started
                  </option>
                  <option value="In Progress">In Progress</option>
                  <option value="Waiting">Waiting</option>
                </select>
              </div>
              <div>
                <label for="priority">Priority:</label>
                <select id="priority">
                  <option value="4" selected="selected">4</option>
                  <option value="3">3</option>
                  <option value="2">2</option>
                  <option value="1">1</option>
                </select>
              </div>
            </div>
            <button type="submit">Submit</button>
            <button type="button" id="taskClose">Close</button>
          </fieldset>
        </form>
        <div>
          <!-- Task List -->
          <div id="taskList"></div>
          <!-- Completed Task List -->
          <div id="completeTaskList"></div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
